<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · LPS Slides</title><style>body{font:16px system-ui;margin:0;background:#151922;color:#f7f4ed}main{max-width:1000px;margin:40px auto;padding:0 20px}section{background:#202532;border:1px solid #3b4352;border-radius:10px;padding:20px;margin:16px 0}input,textarea,select,button{padding:10px;border-radius:6px;border:1px solid #4d5666;background:#151922;color:inherit}button{cursor:pointer;background:#d4b96a;color:#151922;border:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #3b4352}textarea{width:95%;min-height:45px}</style>
<main><h1>Administração</h1><section id="login"><form><label>Email <input id="loginEmail" value="admin"></label><label>Senha <input id="password" type="password"></label> <button>Entrar</button></form><p id="error"></p></section><div id="app" hidden><section><h2>Usuários</h2><div class="row"><input id="email" placeholder="email@exemplo.com"><input id="newPassword" type="password" placeholder="senha (10+ caracteres)"><select id="role"><option value="presenter">presenter</option><option value="admin">admin</option></select><button id="add">Adicionar</button></div><table><thead><tr><th>Email</th><th>Perfil</th><th>Ativo</th><th></th></tr></thead><tbody id="users"></tbody></table></section><section><h2>Slides e cola</h2><table><thead><tr><th>Posição</th><th>O que dizer</th><th>Tom</th><th>A seguir</th><th></th></tr></thead><tbody id="slides"></tbody></table></section><section><h2>Tempo por slide</h2><table><thead><tr><th>Slide</th><th>Segundos</th></tr></thead><tbody id="metrics"></tbody></table></section></div></main>
<script>const $=s=>document.querySelector(s),api=(p,o)=>fetch('/api'+p,o).then(async r=>{const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||r.status);return b});async function load(){const u=await api('/admin/users');$('#users').innerHTML=u.results.map(x=>`<tr><td>${x.email}</td><td>${x.role}</td><td>${x.active?'sim':'não'}</td><td>${x.active?`<button data-id="${x.id}">remover</button>`:''}</td></tr>`).join('');$('#users').querySelectorAll('button').forEach(b=>b.onclick=async()=>{await api('/admin/users/'+b.dataset.id,{method:'DELETE'});load()});const s=await api('/admin/slides');$('#slides').innerHTML=s.results.map(x=>`<tr><td>${x.position+1}</td><td><textarea data-f="cue">${x.cue||''}</textarea></td><td><textarea data-f="tone">${x.tone||''}</textarea></td><td><textarea data-f="next_cue">${x.next_cue||''}</textarea></td><td><button data-save="${x.id}">salvar</button></td></tr>`).join('');$('#slides').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const row=b.closest('tr');const body=Object.fromEntries([...row.querySelectorAll('textarea')].map(x=>[x.dataset.f,x.value]));await api('/admin/slides/'+b.dataset.save,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});b.textContent='ok'});const m=await api('/admin/metrics');$('#metrics').innerHTML=m.results.map(x=>`<tr><td>${x.slide_position+1}</td><td>${x.seconds}</td></tr>`).join('')}$('#login form').onsubmit=async e=>{e.preventDefault();try{await api('/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#loginEmail').value,password:$('#password').value})});$('#login').hidden=true;$('#app').hidden=false;load()}catch{$('#error').textContent='credenciais inválidas'}};$('#add').onclick=async()=>{await api('/admin/users',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#newPassword').value,role:$('#role').value})});$('#email').value='';$('#newPassword').value='';load()}</script>
